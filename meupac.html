function isoAt(dayOffset,h,m){
  const d=new Date(); d.setDate(d.getDate()+dayOffset); d.setHours(h,m,0,0); return d.toISOString();
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function icon(name,cls='',fill=false){return `<span class="material-symbols-outlined ${fill?'ms-fill':''} ${cls}">${name}</span>`;}
function fmtTime(iso){const d=new Date(iso);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtDT(iso){const d=new Date(iso);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})+' às '+fmtTime(iso);}
function fmtDTShort(iso){const d=new Date(iso);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' às '+fmtTime(iso);}
function todayKey(iso){const d=new Date(iso);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();}
function isToday(iso){return todayKey(iso)===todayKey(new Date().toISOString());}
function getForm(id){return DB.forms.find(f=>f.id===id);}
function getPac(id){return DB.pacs.find(p=>p.id===id);}
function pacOf(formId){const f=getForm(formId);return f?getPac(f.pacId):null;}
function subsFor(formId){return DB.submissions.filter(s=>s.formId===formId);}
function todaySubFor(formId){return subsFor(formId).find(s=>isToday(s.ts));}
function hashFor(sub){const d=new Date(sub.ts);return 'PAC-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+fmtTime(sub.ts).replace(':','');}

function formStatus(f){
  const sub = todaySubFor(f.id);
  if(sub) return sub.occurrence ? 'ocorrencia' : 'concluido';
  // sem envio de hoje: nunca "concluído" (seria falso) — vira pendência
  return f.defaultStatus==='concluido' ? 'afazer' : f.defaultStatus;
}
function daysLabel(days){ if(!days||!days.length||days.length===7) return 'todos os dias'; const nm=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']; return days.slice().sort((a,b)=>a-b).map(i=>nm[i]).join(', '); }
function dueText(f){
  const s=f.schedule; let when='';
  if(s){
    if(s.type==='intervalo'&&s.every) when=`a cada ${s.every} ${s.unit||'horas'}`;
    else if(s.type==='vezes'&&s.count) when=`${s.count}x ${s.period==='semana'?'por semana':s.period==='mes'?'ao mês':'ao dia'}`;
    else if(s.type==='momentos'&&s.moments&&s.moments.length){const map={inicio:'Início do expediente',fim:'Fim do expediente'};when=s.moments.map(m=>map[m]||m).join(' e ');}
    else if(s.type==='demanda') return 'Sob demanda';
    else if(s.type==='fixos'&&s.times&&s.times.length) when='às '+s.times.join(', ');
    if(when) return when+' · '+daysLabel(s.days);
  }
  const ts=(f.times&&f.times.length)?f.times:(f.due?[f.due]:[]);
  return (ts.length ? 'às '+ts.join(', ') : 'Sem horário específico')+' · '+daysLabel(f.days);
}

function formOwner(f){ return f.operatorId || OWNER[f.id] || null; } // null = ainda não atribuída (visível a todos)
function visibleToOperator(f,uid){ const o=formOwner(f); return o===null || o===uid; }
function pacActive(p){ return p && p.active !== false; } // undefined = ativo por padrão

// hierarquia de conta: Titular (dono) > Gestor > Operador
const TITULAR_ID='u_camila';
function isTitular(t){ return t && (t.titular===true || t.id===TITULAR_ID); }
function canManage(t){
  if(!t || t.id===currentUser.id) return false;      // ninguém se autogerencia aqui
  if(isTitular(t)) return false;                      // titular não é editável/removível por ninguém
  const me=(DB.team||[]).find(x=>x.id===currentUser.id);
  const meTitular=isTitular(me), meGestor=currentUser.role==='gerente';
  if(t.role==='Operador') return meTitular||meGestor; // operador: titular ou gestor
  return meTitular;                                   // outro gestor: só o titular
}

/* ============================ EXPORT / DOWNLOAD ============================ */
async function downloadFile(filename, blob){
  try{
    if(window.claude && typeof claude.use==='function'){
      const dl=await claude.use('downloads');
      if(dl){ await dl.save({filename, data:blob}); toast('Arquivo gerado.'); return; }
    }
  }catch(e){ if(e&&e.code==='declined') return; }
  try{ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500); toast('Arquivo gerado.'); }
  catch(e2){ toast('Não foi possível gerar o arquivo aqui.','err'); }
}
function pdfHeader(doc,L,R,y){

        <button data-action="close-x" class="tap w-8 h-8 rounded-lg flex items-center justify-center text-on-surface-variant">${icon('close','text-[20px]')}</button>

      <div class="flex flex-wrap gap-2 mb-3">${preset('hoje','Hoje')}${preset('7','7 dias')}${preset('30','30 dias')}${preset('90','Trimestre')}${preset('tudo','Tudo')}</div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="mono text-[10px] uppercase text-on-surface-variant">De</label><input type="date" id="exp-from" max="${fmtISO(today)}" value="${fmtISO(d30)}" class="w-full mt-1 bg-surface-container-low rounded-lg px-3 py-2 text-[13px] text-on-surface border border-transparent focus:border-primary"></div>
        <div><label class="mono text-[10px] uppercase text-on-surface-variant">Até</label><input type="date" id="exp-to" max="${fmtISO(today)}" value="${fmtISO(today)}" class="w-full mt-1 bg-surface-container-low rounded-lg px-3 py-2 text-[13px] text-on-surface border border-transparent focus:border-primary"></div>
      </div>
      <p class="mono text-[10px] uppercase text-on-surface-variant mt-4 mb-2">Formato</p>

      <button data-action="run-export" class="tap w-full mt-4 bg-primary text-on-primary rounded-xl py-3.5 font-semibold flex items-center justify-center gap-2 text-[14px]">${icon('download','',true)} Baixar</button>
    </div></div>`;
  function paintPresets(){document.querySelectorAll('.preset-btn').forEach(b=>b.className=presetCls(b.dataset.preset===window.__exp.preset));}
  document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const n=b.dataset.preset;window.__exp.preset=n;window.__exp.span=SPAN[n];
    const to=fmtISO(new Date());
    if(n==='tudo'){$('exp-from').value='';$('exp-to').value=to;}
    else{$('exp-to').value=to;$('exp-from').value=n==='hoje'?to:addDays(to,-SPAN[n]);}
    paintPresets();});

  $('exp-from').onchange=()=>{let fr=cap($('exp-from').value);$('exp-from').value=fr;if(window.__exp.span!=null&&fr){$('exp-to').value=cap(addDays(fr,window.__exp.span));}};

function runExport(){
  const from=$('exp-from').value, to=$('exp-to').value, fmt=window.__exp.fmt;

function csvCell(v){v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportHistCsv(subs){

  subs.forEach(s=>{const f=getForm(s.formId),pac=getPac(f.pacId);const d=new Date(s.ts);

let opFilter = 'afazer';
function renderOpPac(){
  const uid = currentUser.id;
  const myForms = DB.forms.filter(f=>visibleToOperator(f,uid) && pacActive(getPac(f.pacId))); // escopo: só o que é dele e de PAC ativo
  const rank = st => st==='atrasado' ? 0 : ['pendente','afazer','agendado'].includes(st) ? 1 : 2;
  const dueMin = f => { const [h,m]=(f.due||'23:59').split(':').map(Number); return h*60+(m||0); };
  const isDone = f => !!todaySubFor(f.id); // concluída = enviada hoje

  const todo = myForms.filter(f=>!isDone(f)).sort((a,b)=>rank(formStatus(a))-rank(formStatus(b))||dueMin(a)-dueMin(b));
  const done = myForms.filter(f=>isDone(f)).sort((a,b)=>new Date(todaySubFor(b.id).ts)-new Date(todaySubFor(a.id).ts));
  const late = todo.filter(f=>formStatus(f)==='atrasado').length;

  // linha achatada (A fazer / Concluídas) — traz a tag do PAC
  const flatRow = f=>{const st=formStatus(f);const pac=getPac(f.pacId);const sub=todaySubFor(f.id);const t=sub?'Enviado às '+fmtTime(sub.ts):dueText(f);
    return pcard({icon:pac.icon, occ:st==='ocorrencia', title:f.title,
      meta:`${statusChip(st)}<span class="flex items-center gap-1 truncate">${icon('schedule','text-[13px] flex-none')} ${esc(t)}</span>`,
      trailing:icon('chevron_right','text-on-surface-variant flex-none'),
      open:`data-action="open-form" data-form="${f.id}"`});
  };

  const all = myForms.slice().sort((a,b)=>rank(formStatus(a))-rank(formStatus(b))||dueMin(a)-dueMin(b));

  const empty=(ic,t,s)=>`<div class="flex flex-col items-center py-14 text-center">${icon(ic,'text-secondary text-[44px]',true)}<p class="font-semibold text-on-surface mt-2">${t}</p><p class="text-[12px] text-on-surface-variant">${s}</p></div>`;
  let body='';
  if(opFilter==='afazer') body = todo.length ? `<div class="space-y-2.5">${todo.map(flatRow).join('')}</div>` : empty('task_alt','Tudo em dia!','Nenhuma planilha pendente no seu turno.');

function bindFillEvents(f){
  document.querySelectorAll('[data-param][data-type="numeric"]').forEach(box=>{
    const pid=box.dataset.param, min=+box.dataset.min, max=+box.dataset.max, step=+box.dataset.step;
    const input=box.querySelector('.param-val'), st=box.querySelector('.param-status');
    function refresh(){
      const raw=input.value.trim();
      if(raw===''){ // vazio = ainda não medido
        window.__fill[pid]=null;
        st.textContent='— sem medição';
        st.className='param-status mono text-[10px] font-semibold uppercase tracking-wide text-on-surface-variant';
        input.className='num-input param-val mono text-[28px] font-bold bg-transparent w-24 text-center text-on-surface placeholder:text-outline-variant';
        return;
      }
      let v=parseFloat(raw); if(isNaN(v))v=0;
      window.__fill[pid]=v;
      const ok=v>=min&&v<=max;
      st.textContent = ok?'✓ Dentro da faixa':'▲ Fora da faixa';
      st.className='param-status mono text-[10px] font-semibold uppercase tracking-wide '+(ok?'text-secondary':'text-error');
      input.className='num-input param-val mono text-[28px] font-bold bg-transparent w-24 text-center '+(ok?'text-on-surface':'text-error');
    }
    // primeiro toque no stepper parte do mínimo da faixa; depois ajusta
    box.querySelector('[data-step-btn="+"]').onclick=()=>{input.value=(input.value.trim()===''?min:(parseFloat(input.value)+step)).toFixed(1);refresh();};
    box.querySelector('[data-step-btn="-"]').onclick=()=>{input.value=(input.value.trim()===''?min:(parseFloat(input.value)-step)).toFixed(1);refresh();};
    input.oninput=refresh; refresh();
  });
  document.querySelectorAll('[data-param][data-type="qualitative"]').forEach(box=>{
    const pid=box.dataset.param, good=box.dataset.good;
    const btnOk=box.querySelector('[data-qual="ok"]'), btnNo=box.querySelector('[data-qual="no"]');
    function setOk(ok){
      window.__fill[pid]={ok, val: ok?good:'Não conforme'};
      btnOk.className='qual-btn tap flex items-center justify-center gap-1.5 py-2.5 rounded-lg font-semibold text-[13px] '+(ok?'bg-conf-bg text-conf-tx ring-1 ring-conf-bd':'bg-surface-container text-on-surface-variant');
      btnNo.className='qual-btn tap flex items-center justify-center gap-1.5 py-2.5 rounded-lg font-semibold text-[13px] '+(!ok?'bg-nc-bg text-nc-tx ring-1 ring-nc-bd':'bg-surface-container text-on-surface-variant');
    }
    btnOk.onclick=()=>setOk(true); btnNo.onclick=()=>setOk(false);
    // nada selecionado por padrão
  });
}

function submitFill(){
  const f=getForm(params.form);
  // exige que toda medição tenha sido preenchida
  const faltando=f.params.filter(p=>{const v=window.__fill[p.id];return v===null||v===undefined;});
  if(faltando.length){toast('Preencha: '+faltando.map(p=>p.name).join(', '),'err');return;}
  const values={}; let conforme=true; const issues=[];
  f.params.forEach(p=>{
    if(p.type==='numeric'){
      const v=window.__fill[p.id]; const ok=v>=p.min&&v<=p.max;
      values[p.id]={ok,val:v.toFixed(1)+' '+p.unit,num:v};
      if(!ok){conforme=false;issues.push(`${p.name}: ${v.toFixed(1)} ${p.unit} (faixa ${p.min}–${p.max})`);}
    } else {
      const s=window.__fill[p.id]; values[p.id]={ok:s.ok,val:s.val};
      if(!s.ok){conforme=false;issues.push(`${p.name}: não conforme`);}
    }
  });
  const note=($('fill-note')&&$('fill-note').value.trim())||'';
  const sub={id:'s'+Date.now(),formId:f.id,operatorId:currentUser.id,operatorName:currentUser.name,ts:new Date().toISOString(),
    values,conforme,occurrence: conforme?null:{issues,note}, note, signedBy:null,signedAt:null};
  DB.submissions.unshift(sub); saveDB();
  toast('Registro enviado e assinado.');
  opFilter='afazer'; navigate('op_pac');
}

// card único de planilha/registro: ícone · título · meta(operador · horário) · ação à direita; faixa vermelha = ocorrência
function pcard(o){
  const occ=!!o.occ;
  return `<div ${o.open||''} class="tap w-full flex items-center gap-3 bg-surface-container-lowest border ${occ?'border-l-4 border-l-nc-bd ':''}border-outline-variant/60 rounded-xl px-3.5 py-3 text-left">
    <span class="w-9 h-9 rounded-lg ${occ?'bg-nc-bg':'bg-surface-container'} flex items-center justify-center flex-none">${icon(o.icon,(occ?'text-nc-tx':'text-primary')+' text-[20px]',true)}</span>
    <div class="flex-1 min-w-0">
      <div class="font-medium text-on-surface text-[14px] truncate">${esc(o.title)}</div>
      ${o.meta?`<div class="flex items-center gap-1 mt-0.5 min-w-0 text-[11px] text-on-surface-variant">${o.meta}</div>`:''}
      ${o.extra||''}
    </div>
    ${o.trailing||''}
  </div>`;
}
function histCard(s,showAssinar){
  const f=getForm(s.formId); const pac=getPac(f.pacId);
  const meta = showAssinar
    ? `${icon('schedule','text-[14px] flex-none')}<span class="truncate">${esc(s.operatorName)} às ${fmtTime(s.ts)}</span>`
    : `${icon('schedule','text-[14px] flex-none')}<span class="truncate">Enviado às ${fmtTime(s.ts)}</span>`;
  const extra = s.occurrence ? `<div class="text-[11px] text-nc-tx font-medium truncate mt-0.5">Ocorrência: ${esc(s.occurrence.issues[0])}</div>` : '';
  let trailing;
  if(showAssinar){
    trailing = s.signedBy
      ? `<span class="flex items-center gap-1 text-[11px] font-semibold text-secondary flex-none">${icon('verified','text-[16px]',true)} Assinado</span>`
      : `<button data-action="sign" data-sub="${s.id}" class="tap flex items-center gap-1.5 bg-primary text-on-primary text-[12px] font-semibold px-3 py-1.5 rounded-lg flex-none">${icon('draw','text-[16px]')} Assinar</button>`;
  } else {
    trailing = icon('chevron_right','text-on-surface-variant flex-none');
  }
  return pcard({icon:pac.icon, occ:s.occurrence, title:f.title, meta, extra, trailing, open:`data-action="open-sub" data-sub="${s.id}"`});
}
function bindHist(subs,showAssinar){
  let filt='todos', op='Todos', q='', scope='', lastRows=subs.slice();
  const list=$('hist-list'), empty=$('hist-empty'), search=$('hist-search');
  function apply(){
    let rows=subs.filter(s=>{
      const f=getForm(s.formId),pac=getPac(f.pacId);
      if(filt==='hoje'&&!isToday(s.ts))return false;
      if(filt==='ocorrencia'&&!s.occurrence)return false;
      if(filt==='assinar'&&s.signedBy)return false;
      if(op!=='Todos'&&s.operatorName!==op)return false;
      if(scope.startsWith('pac:')&&f.pacId!==scope.slice(4))return false;
      if(scope.startsWith('form:')&&f.id!==scope.slice(5))return false;
      if(q){const t=(f.title+' '+pac.name+' '+s.operatorName).toLowerCase();if(!t.includes(q))return false;}
      return true;
    });
    lastRows=rows;
    if(!rows.length){list.innerHTML='';empty.classList.remove('hidden');empty.classList.add('flex');}
    else{empty.classList.add('hidden');empty.classList.remove('flex');
      // group by day
      const groups={};rows.forEach(s=>{const d=new Date(s.ts);const k=isToday(s.ts)?'Hoje':(todayKey(s.ts)===todayKey(isoAt(-1,0,0))?'Ontem':d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long'}));(groups[k]=groups[k]||[]).push(s);});
      list.innerHTML=Object.entries(groups).map(([k,arr])=>{const isHoje=k==='Hoje';return `<div class="flex items-center gap-2 pt-1"><span class="w-2 h-2 rounded-full ${isHoje?'bg-secondary':'bg-outline-variant'}"></span><span class="mono text-[10px] uppercase tracking-widest ${isHoje?'text-on-surface':'text-on-surface-variant'} font-semibold">${k}</span><span class="mono text-[10px] text-on-surface-variant">· ${arr.length} registro${arr.length>1?'s':''}</span></div>`+arr.map(s=>histCard(s,showAssinar)).join('');}).join('');
    }
  }
  document.querySelectorAll('.filt-btn').forEach(b=>b.onclick=()=>{filt=b.dataset.filt;document.querySelectorAll('.filt-btn').forEach(x=>x.className='filt-btn tap whitespace-nowrap text-[13px] font-semibold px-3.5 py-1.5 rounded-full bg-surface-container-lowest border border-outline-variant/60 text-on-surface-variant');b.className='filt-btn tap whitespace-nowrap text-[13px] font-semibold px-3.5 py-1.5 rounded-full bg-primary text-on-primary';apply();});
  const opLabel = v => v==='Todos'?'Todos os operadores':v;
  const scopeLabel = v => { if(!v) return 'Todos os PACs'; if(v.startsWith('pac:')){const p=getPac(v.slice(4));return 'Todo o '+(p?p.code:'');} const f=getForm(v.slice(5)); return f?f.title:'Planilha'; };
  function wireDD(key){
    const wrap=document.querySelector(`[data-dd="${key}"]`); if(!wrap)return;
    const trigger=wrap.querySelector('.dd-trigger'), panel=wrap.querySelector('.dd-panel'), label=wrap.querySelector('.dd-label');
    trigger.onclick=(e)=>{e.stopPropagation();const wasOpen=!panel.classList.contains('hidden');document.querySelectorAll('.dd-panel').forEach(p=>p.classList.add('hidden'));if(!wasOpen)panel.classList.remove('hidden');};
    panel.querySelectorAll('[data-val]').forEach(opt=>opt.onclick=(e)=>{
      e.stopPropagation();const val=opt.dataset.val;
      if(key==='op'){op=val;label.textContent=opLabel(val);} else {scope=val;label.textContent=scopeLabel(val);}
      panel.querySelectorAll('.dd-check').forEach(c=>c.classList.add('invisible'));
      const chk=opt.querySelector('.dd-check'); if(chk)chk.classList.remove('invisible');
      panel.classList.add('hidden'); apply();
    });
  }
  wireDD('op'); wireDD('scope');
  if(!window.__ddBound){window.__ddBound=true;document.addEventListener('click',()=>document.querySelectorAll('.dd-panel').forEach(p=>p.classList.add('hidden')));}
  if(search)search.oninput=()=>{q=search.value.toLowerCase().trim();apply();};
  apply();
}

function secHead(title,n){return `<p class="mono text-[10px] uppercase tracking-widest text-on-surface-variant mb-2">${esc(title)} · ${n}</p>`;}
function computeStats(){
  const today=DB.submissions.filter(s=>isToday(s.ts));

  const awaiting=DB.forms.filter(f=>{const st=formStatus(f);return ['atrasado','pendente','afazer'].includes(st) && pacActive(getPac(f.pacId));});
  return {nc,toSign,signed,awaiting};
}

  if(w.type==='fixos') renderEditorTimes();

function syncWhen(){
  const w=window.__when;
  if(w.type==='fixos'){ syncEditorTimes(); }
  else if(w.type==='intervalo'){ const e=$('ed-every'),u=$('ed-unit'); if(e)w.every=Math.max(1,parseInt(e.value)||1); if(u)w.unit=u.value; }
  else if(w.type==='vezes'){ const c=$('ed-count'),pd=$('ed-period'); if(c)w.count=Math.max(1,parseInt(c.value)||1); if(pd)w.period=pd.value; }
}
function timeSelect(kind,val,i){

    ${opts.map(n=>`<option value="${n}" ${String(n)===String(val)?'selected':''}>${String(n).padStart(2,'0')}</option>`).join('')}
  </select>`;
}
function renderEditorTimes(){
  const wrap=$('ed-times'); if(!wrap)return;

  wrap.innerHTML=window.__editorTimes.map((t,i)=>{
    const parts=(t||'').split(':'); const hv=parts[0]!==undefined&&parts[0]!==''?parseInt(parts[0],10):''; const mv=parts[1]!==undefined&&parts[1]!==''?parseInt(parts[1],10):'';

function syncEditorTimes(){
  window.__editorTimes.forEach((_,i)=>{

function renderEditorParams(){
  const wrap=$('ed-params'); if(!wrap)return;

function syncEditorParams(){
  document.querySelectorAll('#ed-params [data-pidx]').forEach(box=>{
    const i=+box.dataset.pidx, p=window.__editorParams[i];
    p.name=box.querySelector('[data-pname]').value;

    else{p.good=box.querySelector('[data-pgood]').value||'Conforme';}

function saveFormEditor(){
  syncEditorParams(); syncWhen();
  const title=$('ed-title').value.trim();
  if(!title){toast('Informe o título do documento.','err');return;}
  if(window.__editorParams.some(p=>!p.name.trim())){toast('Todo parâmetro precisa de um nome.','err');return;}
  const w=window.__when;
  const days=(w.days||[]).slice().sort();
  let times=[], due='', schedule;
  if(w.type==='fixos'){ times=window.__editorTimes.filter(Boolean).sort(); if(!times.length){toast('Adicione ao menos um horário.','err');return;} due=times[0]||''; schedule={type:'fixos',times,days}; }
  else if(w.type==='intervalo'){ schedule={type:'intervalo',every:w.every,unit:w.unit,days}; }
  else if(w.type==='vezes'){ schedule={type:'vezes',count:w.count,period:w.period,days}; }
  else if(w.type==='momentos'){ const moments=[...w.moments]; if(!moments.length){toast('Selecione ao menos um momento.','err');return;} schedule={type:'momentos',moments,days}; }
  else { schedule={type:'demanda'}; }
  const editing=params.form?getForm(params.form):null;
  const loc=$('ed-loc').value.trim()||'A definir';
  const pac=editing?getPac(editing.pacId):getPac(params.pac||DB.pacs[0].id);
  if(editing){
    editing.title=title;editing.due=due;editing.times=times;editing.schedule=schedule;editing.days=days;editing.location=loc;editing.params=window.__editorParams;
    editing.rev=(editing.rev||1)+1; editing.revDate=new Date().toISOString();
    editing.revHistory=editing.revHistory||[]; editing.revHistory.push({rev:editing.rev,date:editing.revDate});
    toast(`${plCode(editing)} publicada como ${revLabel(editing)} — versão anterior arquivada.`);
  }else{
    const plNum=nextPlNum(pac.id);
    DB.forms.push({id:'f'+Date.now(),pacId:pac.id,plNum,rev:1,revDate:new Date().toISOString(),title,times,schedule,days,due,location:loc,sector:'Definido',defaultStatus:'afazer',params:window.__editorParams});
    toast(`Planilha ${pac.code} · PL ${String(plNum).padStart(2,'0')} criada (Rev. 01).`);
  }
  saveDB();
  navigate('ge_pac_forms',{pac:pac.id});
}

        ${fld('uni-marca','Marca (se houver)',u.marca)}
        ${fld('uni-end','Endereço',u.endereco)}
        ${fld('uni-mun','Município/UF',u.municipio)}
        <div class="grid grid-cols-2 gap-2">${fld('uni-rt','Responsável Técnico',u.rtNome)}${fld('uni-rtreg','Registro (CRMV)',u.rtRegistro)}</div>
      </div>
      <button data-action="save-unidade" class="tap w-full mt-4 bg-primary text-on-primary rounded-xl py-3.5 font-semibold text-[14px]">Salvar dados da unidade</button>
    </div></div>`;
  const li=$('uni-logo'); if(li)li.onchange=()=>{const f=li.files&&li.files[0];if(!f)return;if(f.size>1500000){toast('Logo muito grande (máx ~1,5MB).','err');return;}const r=new FileReader();r.onload=()=>{window.__uniLogo=r.result;const pv=$('uni-logo-prev');if(pv)pv.innerHTML=`<img src="${r.result}" class="w-full h-full object-contain">`;};r.readAsDataURL(f);};
}
function saveUnidade(){
  DB.unidade=Object.assign({},getUnidade(),{
    razaoSocial:$('uni-razao').value.trim(), cnpj:$('uni-cnpj').value.trim(), sif:$('uni-sif').value.trim(),
    marca:$('uni-marca').value.trim(), endereco:$('uni-end').value.trim(), municipio:$('uni-mun').value.trim(),
    rtNome:$('uni-rt').value.trim(), rtRegistro:$('uni-rtreg').value.trim(), logo:window.__uniLogo||null
  });
  saveDB(); closeModal(); toast('Dados da unidade salvos.');
}

/* ===== Editar Acessos ===== */
function editMemberSheet(id){
  const t=DB.team.find(x=>x.id===id); if(!t)return;
  window.__edit={ id:t.id, role: t.role==='Operador'?'Operador':'Gerência', owned:new Set(DB.forms.filter(f=>formOwner(f)===t.id).map(f=>f.id)) };
  renderEditSheet();
}
function renderEditSheet(){
  const e=window.__edit; const t=DB.team.find(x=>x.id===e.id); if(!t)return;
  const roleBtn=(v,label,ic)=>`<button data-action="edit-role" data-role="${v}" class="tap flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-[13px] font-semibold ${e.role===v?'bg-primary text-on-primary':'bg-surface-container text-on-surface-variant'}">${icon(ic,'text-[18px]')} ${label}</button>`;
  const activePacs=DB.pacs.filter(p=>pacActive(p) && DB.forms.some(f=>f.pacId===p.id));
  const pacBlocks=activePacs.map(p=>{const fs=DB.forms.filter(f=>f.pacId===p.id);
    return `<div class="mt-3">
      <div class="flex items-center gap-2 mb-1">
        <span class="w-6 h-6 rounded-md bg-surface-container flex items-center justify-center flex-none">${icon(p.icon,'text-primary text-[15px]',true)}</span>
        <span class="mono text-[10px] uppercase tracking-wide text-on-surface-variant font-semibold truncate">${p.code} · ${esc(p.name)}</span>
      </div>
      <div class="divide-y divide-outline-variant/30 pl-1">
        ${fs.map(f=>{const on=e.owned.has(f.id);
          return `<button data-action="edit-form-toggle" data-form="${f.id}" class="tap w-full flex items-center gap-3 py-2.5 px-1 text-left">
            <div class="flex-1 min-w-0"><div class="text-[13px] font-medium text-on-surface truncate">${esc(f.title)}</div><div class="mono text-[10px] text-on-surface-variant truncate">${plCode(f)} · ${esc(dueText(f))}</div></div>
            <span class="material-symbols-outlined ${on?'ms-fill text-secondary':'text-outline-variant'} text-[24px]">${on?'check_circle':'radio_button_unchecked'}</span>
          </button>`;}).join('')}
      </div>
    </div>`;}).join('');
  const formsSection = pacBlocks || `<div class="mt-3 flex items-center gap-2 bg-surface-container rounded-lg p-3 text-on-surface-variant text-[12px]">${icon('info','text-[18px] flex-none')} Nenhum PAC ativo com planilhas definidas ainda.</div>`;
  $('modal-root').innerHTML=`<div class="fixed inset-0 z-50 fade-in flex items-center justify-center p-4" data-close-modal>
    <div class="absolute inset-0 bg-black/40" data-close-modal></div>
    <div class="relative bg-surface-container-lowest rounded-2xl w-full max-w-[400px] max-h-[85dvh] overflow-y-auto scroll-area shadow-2xl p-4">
      <div class="flex items-center gap-3 pb-4 border-b border-outline-variant/40">
        <span class="w-11 h-11 rounded-full flex items-center justify-center font-mono text-[13px] font-bold" style="background:${t.color};color:${t.ink}">${t.initials}</span>
        <div class="flex-1 min-w-0"><div class="font-semibold text-on-surface truncate">${esc(t.name)}</div><div class="text-[12px] text-on-surface-variant">Editar acessos e permissões</div></div>
        <button data-action="close-x" class="tap w-8 h-8 rounded-lg flex items-center justify-center text-on-surface-variant">${icon('close','text-[20px]')}</button>
      </div>
      <p class="mono text-[10px] uppercase tracking-widest text-on-surface-variant mt-4 mb-2">Função</p>
      <div class="flex gap-2">${roleBtn('Operador','Operador','engineering')}${roleBtn('Gerência','Gestor','shield_person')}</div>
      ${e.role==='Operador'
        ? `<div class="mt-4 flex items-start gap-2 bg-surface-container rounded-lg p-3 text-on-surface-variant text-[12px]">${icon('engineering','text-primary text-[18px] flex-none',true)}<span>O operador preenche e assina digitalmente, no seu turno, apenas as planilhas autorizadas abaixo. Não acessa o painel de gestão, o histórico da fábrica nem assina planilhas de outros.</span></div>
           <p class="mono text-[10px] uppercase tracking-widest text-on-surface-variant mt-4 mb-1">Planilhas Permitidas · ${e.owned.size}</p>${formsSection}`
        : `<div class="mt-4 flex items-start gap-2 bg-inverse-primary rounded-lg p-3 text-primary text-[12px]">${icon('verified_user','text-[18px] flex-none',true)}<span>O gestor valida e assina as planilhas, acompanha o painel e o histórico de toda a unidade e gerencia os operadores. Não preenche planilhas — isso é do operador.</span></div>`}
      <button data-action="save-member" class="tap w-full mt-4 bg-primary text-on-primary rounded-xl py-3.5 font-semibold text-[14px]">Salvar acessos</button>
    </div></div>`;
}
function saveMember(){
  const e=window.__edit; const t=DB.team.find(x=>x.id===e.id); if(!t)return;
  t.role = e.role==='Operador'?'Operador':'Gerência';
  // aplica planilhas permitidas ao escopo real (dono da planilha)
  DB.forms.forEach(f=>{
    const mine=formOwner(f)===t.id;
    if(e.role==='Operador' && e.owned.has(f.id)) f.operatorId=t.id;
    else if(mine) f.operatorId=null; // removida deste operador
  });
  saveDB(); closeModal(); renderEquipe(); toast('Acessos atualizados.');
}
function confirmDelete(id){
  const t=DB.team.find(x=>x.id===id); if(!t)return;
  $('modal-root').innerHTML=`<div class="fixed inset-0 z-50 fade-in flex items-center justify-center p-4" data-close-modal>
    <div class="absolute inset-0 bg-black/40" data-close-modal></div>
    <div class="relative bg-surface-container-lowest rounded-2xl w-full max-w-[380px] shadow-2xl p-5">
      <div class="flex items-center gap-2 mb-2">${icon('person_remove','text-error text-[24px]',true)}<div class="font-semibold text-on-surface text-[16px]">Remover ${esc(t.name)}?</div></div>
      <p class="text-[13px] text-on-surface-variant mb-4">O colaborador perde o acesso ao sistema. Os registros já assinados permanecem intactos na trilha de auditoria.</p>
      <div class="flex gap-2">
        <button data-action="close-x" class="tap flex-1 bg-surface-container text-on-surface rounded-xl py-3 font-semibold text-[14px]">Cancelar</button>
        <button data-action="del-confirm" data-id="${t.id}" class="tap flex-1 bg-error text-on-error rounded-xl py-3 font-semibold text-[14px]">Excluir</button>
      </div>
    </div></div>`;
}
function deleteMember(id){
  DB.team=DB.team.filter(x=>x.id!==id);
  DB.forms.forEach(f=>{ if(f.operatorId===id) f.operatorId=null; });
  saveDB(); closeModal(); renderEquipe(); toast('Colaborador removido.');
}

/* ============================ ROUTER ============================ */
function render(){
  if(!currentUser){renderLogin();return;}
  switch(screen){
    case 'op_pac': renderOpPac(); break;
    case 'op_fill': renderPreencher(); break;
    case 'op_detalhe': renderDetalhe(); break;
    case 'op_hist': renderOpHist(); break;
    case 'ge_painel': renderPainel(); break;
    case 'ge_hist': renderGeHist(); break;
    case 'ge_forms': renderForms(); break;
    case 'ge_pac_forms': renderPacForms(); break;
    case 'ge_form_editor': renderFormEditor(); break;
    case 'ge_equipe': renderEquipe(); break;
    default: currentUser.role==='operador'?renderOpPac():renderPainel();
  }
}

/* ============================ GLOBAL EVENT DELEGATION ============================ */
document.addEventListener('click',(e)=>{
  const closeEl=e.target.closest('[data-close-modal]');
  if(closeEl && e.target===closeEl){closeModal();return;}
  const el=e.target.closest('[data-action]'); if(!el)return;
  const a=el.dataset.action;
  switch(a){
    case 'login':{const u=DB.users.find(x=>x.id===el.dataset.user);currentUser=u;navigate(u.role==='operador'?'op_pac':'ge_painel');break;}
    case 'nav': if(el.dataset.nav==='op_pac') opFilter='afazer'; navigate(el.dataset.nav); break;
    case 'op-filter': opFilter=el.dataset.filter; renderOpPac(); break;
    case 'profile': profileMenu(); break;
    case 'logout': closeModal(); currentUser=null; navigate('login'); break;
    case 'change-pass': closeModal(); toast('Link de redefinição enviado por e-mail.','info'); break;
    case 'unidade': closeModal(); unidadeSheet(); break;
    case 'save-unidade': saveUnidade(); break;
    case 'open-form': navigate('op_fill',{form:el.dataset.form}); break;
    case 'open-form-preview':{const f=getForm(el.dataset.form);toast('Cobrança enviada ao operador de '+getPac(f.pacId).name+'.','info');break;}
    case 'submit-fill': submitFill(); break;
    case 'mock-photo':{const t=$('photo-tag');if(t){t.classList.remove('hidden');t.classList.add('flex');}toast('Foto anexada ao registro.');break;}
    case 'focus-note':{const n=$('fill-note');if(n)n.focus();break;}
    case 'open-sub': navigate('op_detalhe',{sub:el.dataset.sub,from:screen==='op_hist'?'hist':screen}); break;
    case 'sign': sign(el.dataset.sub); break;
    case 'sign-all': signAll(); break;
    case 'open-pac': navigate('ge_pac_forms',{pac:el.dataset.pac}); break;
    case 'toggle-pac-active':{const p=getPac(el.dataset.pac);if(p){p.active=!pacActive(p);saveDB();rerender(renderForms);toast(pacActive(p)?esc(p.name)+' ativado.':esc(p.name)+' desativado.','info');}break;}
    case 'new-form': navigate('ge_form_editor',{pac:el.dataset.pac}); break;
    case 'config-form': navigate('ge_form_editor',{form:el.dataset.form}); break;
    case 'add-param': syncEditorParams(); window.__editorParams.push({id:'np'+Date.now(),type:'numeric',name:'',unit:'',min:0,max:0,step:0.1,seed:0}); renderEditorParams(); break;
    case 'add-time': syncEditorTimes(); window.__editorTimes.push(''); renderEditorTimes(); break;
    case 'del-time': syncEditorTimes(); window.__editorTimes.splice(+el.dataset.idx,1); renderEditorTimes(); break;
    case 'when-type': syncWhen(); window.__when.type=el.dataset.type; renderWhen(); break;
    case 'when-moment':{const s=window.__when.moments;const mm=el.dataset.m;s.has(mm)?s.delete(mm):s.add(mm);renderWhen();break;}
    case 'save-form': saveFormEditor(); break;
    case 'export-pdf': exportRecordPdf(el.dataset.sub); break;
    case 'open-export': exportSheet(); break;
    case 'run-export': runExport(); break;
    case 'invite': toast('Convite de acesso gerado.','info'); break;
    case 'edit-member': editMemberSheet(el.dataset.id); break;
    case 'edit-role': window.__edit.role=el.dataset.role; renderEditSheet(); break;
    case 'edit-form-toggle':{const id=el.dataset.form;const s=window.__edit.owned;s.has(id)?s.delete(id):s.add(id);renderEditSheet();break;}
    case 'save-member': saveMember(); break;
    case 'del-member': confirmDelete(el.dataset.id); break;
    case 'del-confirm': deleteMember(el.dataset.id); break;
    case 'close-x': closeModal(); break;
  }
});

/* ============================ BOOT ============================ */
render();
</script>
</body>
</html>
